[project]
name = "llm-injection-eval"
version = "1.0.0"
description = "A measurement harness for prompt-injection defences: attack-success-rate and utility, with pluggable targets."
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
